name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # pnpm/action-setup must run before actions/setup-node so the cache
      # input can resolve the pnpm version. Node 26.4.0 does not ship
      # Corepack, so the pinned pnpm 11.15.0 is installed by this action
      # directly from package.json's packageManager field.
      - name: Setup pnpm
        # pnpm/action-setup v4.4.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.15.0

      - name: Setup Node.js
        # actions/setup-node v5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # tokenmp-v3-e2e has a dedicated local mock smoke workflow. Keep this
        # fast PR CI job scoped to package/unit tests; the full live-target
        # browser suite remains an explicit, separately managed command.
        run: pnpm turbo run test --filter=!tokenmp-v3-e2e

      - name: Build
        run: pnpm build

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      # Download the open-source Gitleaks CLI at a fixed version directly on
      # the runner. The gitleaks-action wrapper is intentionally NOT used:
      # for organization repositories it may require a GITLEAKS_LICENSE
      # secret, which would break this baseline's no-extra-secret commitment.
      # No repository secret and no GITHUB_TOKEN is referenced, so fork pull
      # requests are scanned without any extra secret.
      - name: Install and verify Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP:?}/gitleaks"
          mkdir -p "$tmpdir"
          cd "$tmpdir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          checksum_file="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$checksum_file" "${base}/${checksum_file}"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$tarball" "${base}/${tarball}"
          # Verify the tarball against the official checksums file. Only the
          # linux_x64 entry is present locally; --ignore-missing skips the rest.
          sha256sum -c --ignore-missing "$checksum_file"
          tar -xzf "$tarball" -C "$tmpdir"
          chmod +x "$tmpdir/gitleaks"
          echo "$tmpdir" >> "$GITHUB_PATH"

      - name: Gitleaks scan
        run: gitleaks git --redact --verbose --exit-code 1 .

  go-auth:
    name: go auth / format / vet / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Pinned to Postgres 17 alpine per ADR 0004.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tokenmp
          POSTGRES_PASSWORD: tokenmp
          POSTGRES_DB: tokenmp_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenmp -d tokenmp_auth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        # Redis 7 alpine for the shared rate-limit token-bucket integration
        # tests in packages/go/ratelimit. The Lua script uses redis.call('TIME')
        # which requires Redis >= 5 (effects replication default).
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AUTH_DATABASE_URL: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_auth?sslmode=disable
      CONFIG_DATABASE_URL: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_config?sslmode=disable
      CONFIG_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_config?sslmode=disable
      LOGGING_DATABASE_URL: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_logging?sslmode=disable
      LOGGING_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_logging?sslmode=disable
      BILLING_DATABASE_URL: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_billing?sslmode=disable
      BILLING_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_billing?sslmode=disable
      NOTICE_DATABASE_URL: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_notice?sslmode=disable
      NOTICE_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_notice?sslmode=disable
      RATING_TEST_REDIS_ADDR: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Go
        # actions/setup-go v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            services/auth/go.sum
            services/executor/go.sum
            services/config/go.sum
            services/logging/go.sum
            services/billing/go.sum
            services/api/go.sum
            services/notice/go.sum
            packages/go/ratelimit/go.sum

      - name: Generated code freshness check (Auth)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          bash packages/contracts/go/check-generated.sh

      # Minimal Executor generated freshness step. Reuses this go-auth job's
      # Go 1.26.5 toolchain; no separate Executor CI job, runtime, build, or
      # test is added. The script byte-compares committed Executor generated
      # models/server against a temp regeneration.
      - name: Generated code freshness check (Executor)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          bash packages/contracts/go/check-generated-executor.sh

      # Full-module race gate: ./... is deliberate rather than a hand-maintained
      # package allowlist. It covers every Executor package today and makes any
      # future package with tests part of this CI gate automatically. Executor
      # tests have no database or live-provider dependency; SDK HTTP tests use
      # only local TLS httptest servers.
      - name: go test -race (Executor full module)
        working-directory: services/executor
        run: go test -race ./...

      - name: Install golang-migrate CLI
        env:
          MIGRATE_VERSION: "4.18.3"
        run: |
          set -euo pipefail
          tmpdir="${RUNNER_TEMP:?}/migrate"
          mkdir -p "$tmpdir"
          # Verify the requested version resolves in the module graph before
          # trusting it. `go list -m -versions` exits non-zero if absent.
          go list -m -versions github.com/golang-migrate/migrate/v4@v${MIGRATE_VERSION} >/dev/null
          # The default migrate build only ships the `stub` database driver.
          # Build with the `postgres` tag so the CLI can talk to PostgreSQL.
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v${MIGRATE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gofmt
        working-directory: services/auth
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        working-directory: services/auth
        run: go vet ./... && go vet -tags=integration ./...

      - name: go test -race (unit)
        working-directory: services/auth
        run: go test -race ./...

      - name: go build
        working-directory: services/auth
        run: |
          go build ./...
          go build -o /tmp/auth-bin ./cmd/auth
          go build -o /tmp/healthcheck-bin ./cmd/healthcheck

      # Build the auth Docker image on the GitHub Runner to validate the
      # Dockerfile end-to-end as part of CI. Build only: the image is not
      # run, not pushed, not published to any registry, and not tagged into
      # a long-lived cache. This step requires no local Docker on developer
      # machines — the Ubuntu runner provides Docker out of the box.
      # Build every deployable Go entrypoint outside go.work with a readonly
      # module graph. This makes missing direct requirements, go.sum entries,
      # or local replace targets fail before Docker's separate image builds.
      - name: Go module autonomy gate (GOWORK=off)
        run: |
          set -euo pipefail
          for service in api auth billing config executor logging notice; do
            (
              cd "services/${service}"
              GOWORK=off go build -mod=readonly "./cmd/${service}"
            )
          done

      - name: Dockerfile COPY source guard
        run: bash tools/check-dockerfile-copy-sources.sh

      # Render only: create throwaway placeholder inputs for Compose's required
      # deployment contract. The command intentionally fails if a required
      # input is omitted; no service is started and no image is pushed.
      - name: docker compose config (render only)
        env:
          AUTH_DATABASE_URL: postgres://placeholder:placeholder@database/tokenmp_auth?sslmode=disable
          CONFIG_DATABASE_URL: postgres://placeholder:placeholder@database/tokenmp_config?sslmode=disable
          LOGGING_DATABASE_URL: postgres://placeholder:placeholder@database/tokenmp_logging?sslmode=disable
          BILLING_DATABASE_URL: postgres://placeholder:placeholder@database/tokenmp_billing?sslmode=disable
          NOTICE_DATABASE_URL: postgres://placeholder:placeholder@database/tokenmp_biz?sslmode=disable
          EXECUTOR_CREDENTIAL_REF_MAP_JSON: '{}'
          API_EXECUTOR_TOKEN: placeholder
          TOKENMP_V3_EXTERNAL_REDIS_ADDR: redis://cache:6379
          AUTH_RATE_LIMIT_TRUSTED_PROXIES: 192.0.2.0/24
          API_RATE_LIMIT_TRUSTED_PROXIES: 192.0.2.0/24
        run: |
          set -euo pipefail
          bash tools/check-compose-env-contract.sh
          inputs="${RUNNER_TEMP:?}/tokenmp-v3-compose-inputs"
          mkdir -p "$inputs"
          trap 'rm -rf "$inputs"' EXIT
          for file in auth-private.pem auth-public.pem notice-public.pem executor-public.pem api-public.pem; do
            : > "$inputs/$file"
          done
          secret='compose-render-secret-must-not-appear'
          for file in auth-rate-limit-hmac api-rate-limit-hmac config-admin-token api-config-service-token billing-logging-service-token; do
            printf '%s' "$secret" > "$inputs/$file"
          done
          rendered="$inputs/compose.rendered.yaml"
          AUTH_JWT_PRIVATE_KEY_FILE="$inputs/auth-private.pem" \
          AUTH_JWT_PUBLIC_KEY_FILE="$inputs/auth-public.pem" \
          NOTICE_JWT_PUBLIC_KEY_FILE="$inputs/notice-public.pem" \
          EXECUTOR_JWT_PUBLIC_KEY_FILE="$inputs/executor-public.pem" \
          API_JWT_PUBLIC_KEY_FILE="$inputs/api-public.pem" \
          TOKENMP_V3_AUTH_RATE_LIMIT_HMAC_SECRET_FILE="$inputs/auth-rate-limit-hmac" \
          TOKENMP_V3_API_RATE_LIMIT_HMAC_SECRET_FILE="$inputs/api-rate-limit-hmac" \
          TOKENMP_V3_CONFIG_ADMIN_TOKEN_FILE="$inputs/config-admin-token" \
          TOKENMP_V3_API_CONFIG_SERVICE_TOKEN_FILE="$inputs/api-config-service-token" \
          TOKENMP_V3_BILLING_LOGGING_SERVICE_TOKEN_FILE="$inputs/billing-logging-service-token" \
          docker compose -p tokenmp-v3 config > "$rendered"
          ! grep -F -- "$secret" "$rendered"

      - name: docker build (build only, no run/push)
        run: docker build -f services/auth/Dockerfile -t tokenmp-v3-auth:${{ github.sha }} .

      # Build the executor Docker image on the GitHub Runner to validate the
      # Dockerfile end-to-end as part of CI. Build only: the image is not
      # run, not pushed, not published to any registry, and not tagged into
      # a long-lived cache. This step requires no local Docker on developer
      # machines — the Ubuntu runner provides Docker out of the box.
      - name: docker build executor (build only, no run/push)
        run: docker build -f services/executor/Dockerfile -t tokenmp-v3-executor:${{ github.sha }} .

      # Each deployable Go service has a separate image. Build these images
      # only to validate their repo-root build contexts and Dockerfiles; no
      # image is run, pushed, or published by CI.
      - name: docker build notice (build only, no run/push)
        run: docker build -f services/notice/Dockerfile -t tokenmp-v3-notice:${{ github.sha }} .

      - name: docker build api (build only, no run/push)
        run: docker build -f services/api/Dockerfile -t tokenmp-v3-api:${{ github.sha }} .

      - name: docker build billing (build only, no run/push)
        run: docker build -f services/billing/Dockerfile -t tokenmp-v3-billing:${{ github.sha }} .

      - name: docker build config (build only, no run/push)
        run: docker build -f services/config/Dockerfile -t tokenmp-v3-config:${{ github.sha }} .

      - name: docker build logging (build only, no run/push)
        run: docker build -f services/logging/Dockerfile -t tokenmp-v3-logging:${{ github.sha }} .

      # ------------------------------------------------------------------
      # Config service (skeleton): gofmt / vet / build / unit test / migration
      # cycle / repository integration test. Reuses this job's Postgres 17
      # service via a separate tokenmp_config database created below.
      # ------------------------------------------------------------------
      - name: Create tokenmp_config database
        env:
          PGPASSWORD: tokenmp
        run: |
          psql -h localhost -U tokenmp -d postgres -c "CREATE DATABASE tokenmp_config;" || true

      - name: gofmt (config)
        working-directory: services/config
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet (config)
        working-directory: services/config
        run: go vet ./...

      - name: go build (config)
        working-directory: services/config
        run: |
          go build ./...
          go build -o /tmp/config-bin ./cmd/config

      - name: go test -race (config unit)
        working-directory: services/config
        run: go test -race ./internal/config/... ./internal/database/... ./internal/server/...

      - name: Config migration cycle (up/down/up)
        working-directory: services/config
        run: |
          set -euo pipefail
          migrate -path migrations -database "$CONFIG_DATABASE_URL" up
          migrate -path migrations -database "$CONFIG_DATABASE_URL" down -all
          migrate -path migrations -database "$CONFIG_DATABASE_URL" up

      - name: go test -race (config repository integration)
        working-directory: services/config
        env:
          CONFIG_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_config?sslmode=disable
        run: go test -race ./internal/repository/...

      # ------------------------------------------------------------------
      # Logging service (skeleton): gofmt / vet / build / unit test / migration
      # cycle / repository integration test. Reuses this job's Postgres 17
      # service via a separate tokenmp_logging database created below.
      # ------------------------------------------------------------------
      - name: Create tokenmp_logging database
        env:
          PGPASSWORD: tokenmp
        run: |
          psql -h localhost -U tokenmp -d postgres -c "CREATE DATABASE tokenmp_logging;" || true

      - name: gofmt (logging)
        working-directory: services/logging
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet (logging)
        working-directory: services/logging
        run: go vet ./...

      - name: go build (logging)
        working-directory: services/logging
        run: |
          go build ./...
          go build -o /tmp/logging-bin ./cmd/logging

      - name: go test -race (logging unit)
        working-directory: services/logging
        run: go test -race ./internal/config/... ./internal/database/... ./internal/server/...

      - name: Logging migration cycle (up/down/up)
        working-directory: services/logging
        run: |
          set -euo pipefail
          migrate -path migrations -database "$LOGGING_DATABASE_URL" up
          migrate -path migrations -database "$LOGGING_DATABASE_URL" down -all
          migrate -path migrations -database "$LOGGING_DATABASE_URL" up

      - name: go test -race (logging repository integration)
        working-directory: services/logging
        env:
          LOGGING_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_logging?sslmode=disable
        run: go test -race ./internal/repository/...

      # ------------------------------------------------------------------
      # Billing service (skeleton): gofmt / vet / build / unit test / migration
      # cycle / repository integration test. Reuses this job's Postgres 17
      # service via a separate tokenmp_billing database created below.
      # ------------------------------------------------------------------
      - name: Create tokenmp_billing database
        env:
          PGPASSWORD: tokenmp
        run: |
          psql -h localhost -U tokenmp -d postgres -c "CREATE DATABASE tokenmp_billing;" || true

      - name: gofmt (billing)
        working-directory: services/billing
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet (billing)
        working-directory: services/billing
        run: go vet ./...

      - name: go build (billing)
        working-directory: services/billing
        run: |
          go build ./...
          go build -o /tmp/billing-bin ./cmd/billing

      - name: go test -race (billing unit)
        working-directory: services/billing
        run: go test -race ./internal/config/... ./internal/database/... ./internal/server/... ./internal/sweeper/... ./internal/evidence/...

      - name: Billing migration cycle (up/down/up)
        working-directory: services/billing
        run: |
          set -euo pipefail
          migrate -path migrations -database "$BILLING_DATABASE_URL" up
          migrate -path migrations -database "$BILLING_DATABASE_URL" down -all
          migrate -path migrations -database "$BILLING_DATABASE_URL" up

      - name: go test -race (billing repository integration)
        working-directory: services/billing
        env:
          BILLING_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_billing?sslmode=disable
        run: go test -race ./internal/repository/...

      # ------------------------------------------------------------------
      # Edge/BFF (api service): gofmt / vet / build / test. No DB needed.
      # ------------------------------------------------------------------
      - name: gofmt (api)
        working-directory: services/api
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet (api)
        working-directory: services/api
        run: go vet ./...

      - name: go build (api)
        working-directory: services/api
        run: |
          go build ./...
          go build -o /tmp/api-bin ./cmd/api

      - name: go test -race (api)
        working-directory: services/api
        run: go test -race ./...

      # ------------------------------------------------------------------
      # Notice service: gofmt / vet / build / unit test / migration
      # cycle / repository integration test. Reuses this job's Postgres 17
      # service via a separate tokenmp_notice database created below.
      # ------------------------------------------------------------------
      - name: Create tokenmp_notice database
        env:
          PGPASSWORD: tokenmp
        run: |
          psql -h localhost -U tokenmp -d postgres -c "CREATE DATABASE tokenmp_notice;" || true

      - name: gofmt (notice)
        working-directory: services/notice
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet (notice)
        working-directory: services/notice
        run: go vet ./...

      - name: go build (notice)
        working-directory: services/notice
        run: |
          go build ./...
          go build -o /tmp/notice-bin ./cmd/notice

      - name: Notice migration cycle (up/down/up)
        working-directory: services/notice
        run: |
          set -euo pipefail
          migrate -path migrations -database "$NOTICE_DATABASE_URL" up
          migrate -path migrations -database "$NOTICE_DATABASE_URL" down -all
          migrate -path migrations -database "$NOTICE_DATABASE_URL" up

      - name: go test -race (notice)
        working-directory: services/notice
        env:
          NOTICE_DATABASE_URL: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_notice?sslmode=disable
          NOTICE_REPO_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_notice?sslmode=disable
        run: go test -race ./...

      - name: Migration cycle (up/down/up)
        working-directory: services/auth
        run: |
          set -euo pipefail
          migrate -path migrations -database "$AUTH_DATABASE_URL" up
          migrate -path migrations -database "$AUTH_DATABASE_URL" down -all
          migrate -path migrations -database "$AUTH_DATABASE_URL" up

      - name: go test -race (auth repository integration)
        working-directory: services/auth
        env:
          AUTH_REPOSITORY_TEST_DSN: postgres://tokenmp:tokenmp@localhost:5432/tokenmp_auth?sslmode=disable
        run: go test -race ./internal/repository/...

      - name: Integration tests
        working-directory: services/auth
        run: go test -tags=integration -race ./test/integration/...

      # ------------------------------------------------------------------
      # Shared rate-limit package (packages/go/ratelimit): gofmt / vet /
      # build / unit race tests / real-Redis integration race tests. The
      # Redis 7 service container above backs the build-tagged integration
      # suite (token bucket burst/refill, two-instance sharing, TTL,
      # concurrency, Redis-down 503, HMAC key non-leak).
      # ------------------------------------------------------------------
      - name: gofmt (ratelimit package)
        working-directory: packages/go/ratelimit
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet (ratelimit package)
        working-directory: packages/go/ratelimit
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: go build (ratelimit package)
        working-directory: packages/go/ratelimit
        run: go build ./...

      - name: go test -race (ratelimit package unit)
        working-directory: packages/go/ratelimit
        run: go test -race ./...

      - name: go test -race (ratelimit package Redis integration)
        working-directory: packages/go/ratelimit
        env:
          RATING_TEST_REDIS_ADDR: redis://127.0.0.1:6379/0
          RATELIMIT_REQUIRE_REDIS_TESTS: "true"
        run: |
          # Explicitly wait for the Redis service container to be ready before
          # running the required integration suite, so a slow container startup
          # can never cause a false skip (required mode fatals on ping failure).
          timeout=60
          while [ "$timeout" -gt 0 ]; do
            if redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1; then
              echo "redis ready"
              break
            fi
            echo "waiting for redis..."
            sleep 1
            timeout=$((timeout-1))
          done
          if [ "$timeout" -le 0 ]; then
            echo "redis did not become ready in time" >&2
            exit 1
          fi
          go test -tags=integration -race ./...
