function toast(msg,type="info"){const r=$("#toast-root");const e=document.createElement("div");e.className=`toast toast-${type}`;e.textContent=msg;r.appendChild(e);setTimeout(()=>{e.style.opacity="0";e.style.transform="translateY(0.5rem)";setTimeout(()=>e.remove(),200);},3000);}
function showModal({title,body,footer}){$("#modal-root").innerHTML=`<div class="modal-overlay" id="mo"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3 class="modal-title">${title}</h3></div><div class="modal-body">${body}</div><div class="modal-foot">${footer||""}</div></div></div>`;$("#mo").addEventListener("click",e=>{if(e.target.id==="mo")closeModal();});}
function closeModal(){$("#modal-root").innerHTML="";}
function initTheme(){const s=localStorage.getItem("tokenmp-theme");if(s)document.documentElement.setAttribute("data-theme",s);}
function toggleTheme(){const c=document.documentElement.getAttribute("data-theme");const n=c==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);localStorage.setItem("tokenmp-theme",n);}
/* ===== Router ===== */
function renderPlaceholder(){const p=window.location.hash.slice(1);panelLayout(()=>{$("#panel-main").innerHTML=`<div class="page-header"><div><h1 class="page-title">${({"/panel/announcements":"公告","/panel/notifications":"通知"})[p]||"页面"}</h1><p class="page-desc">此页面在后续迭代中实现</p></div></div><div class="card card-pad"><div class="empty">${I.inbox}<p>暂未实现</p></div></div>`;});}
const routes={"/login":renderLogin,"/register":renderRegister,"/forgot-password":renderForgot,"/panel":renderPanel,"/panel/keys":renderKeys,"/panel/requests":renderReqs,"/panel/settings":renderSet,"/panel/announcements":renderPlaceholder,"/panel/notifications":renderPlaceholder};
function navigate(p){window.location.hash=p;}
window.addEventListener("hashchange",router);
function router(){const p=window.location.hash.slice(1)||"/login";const a=p.startsWith("/login")||p.startsWith("/register")||p.startsWith("/forgot");if(!auth.state.isAuthenticated&&!a){navigate("/login");return;}if(auth.state.isAuthenticated&&a){navigate("/panel");return;}(routes[p]||renderLogin)();}

/* ===== Auth Shell ===== */
function authShell({title,desc,children,footer,mode}){const isLogin=mode==="login";return`<main class="auth-page"><section class="auth-brand"><div class="auth-brand-logo"><span class="lk">${LOGO}</span><span class="auth-logo-text">TokenMP</span></div><h2 class="auth-brand-title">统一接入主流 AI 模型的 API 网关</h2><p class="auth-brand-desc">登录后管理 API Key、请求日志与套餐用量。OpenAI / Anthropic 双协议兼容。</p><div class="auth-brand-card"><div class="flex items-center gap-2"><span class="lk" style="width:2.5rem;height:2.5rem">${LOGO}</span><div><div class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:0.05em">TokenMP</div><div class="text-sm" style="font-weight:var(--tmp-ref-font-weight-semibold)">集中管理 Key、路由和账单视图</div></div></div></div></section><section class="auth-form-side"><div class="auth-card"><div class="auth-logo"><span class="lk">${LOGO}</span><span class="auth-logo-text">TokenMP</span></div><div class="auth-tabs"><a href="#/login" class="auth-tab ${isLogin?"active":""}">登录</a><a href="#/register" class="auth-tab ${!isLogin?"active":""}">注册</a></div><h1 class="auth-title">${title}</h1><p class="auth-desc">${desc}</p>${children}<div class="auth-footer">${footer}</div></div></section></main>`;}

function renderLogin(){
  $("#app").innerHTML=authShell({mode:"login",title:"登录",desc:"输入邮箱和密码继续使用 TokenMP",footer:`还没有账号？<a class="auth-link" href="#/register">立即注册</a>`,children:`
    <form class="auth-form" id="login-form">
      <div class="auth-field"><label class="label" for="email">邮箱</label><input class="input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required /></div>
      <div class="auth-field"><label class="label" for="password">密码</label><div class="auth-pw-wrap"><input class="input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required style="padding-right:2.5rem" /><button type="button" class="auth-pw-toggle" id="pw-toggle" aria-label="显示密码">${I.eye}</button></div></div>
      <div class="auth-row"><label class="flex items-center gap-2 text-sm text-muted"><input type="checkbox" class="checkbox" id="remember" /> 记住我</label><a class="auth-link" href="#/forgot-password">忘记密码？</a></div>
      <div id="login-error"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">登录 TokenMP</button>
    </form>`});
  $("#pw-toggle").onclick=()=>{const i=$("#password");const p=i.type==="password";i.type=p?"text":"password";$("#pw-toggle").innerHTML=p?I.eyeOff:I.eye;};
  $("#login-form").onsubmit=async(e)=>{e.preventDefault();const b=$("#login-btn");const em=$("#email").value.trim();const pw=$("#password").value;b.disabled=true;b.innerHTML='<span class="spinner"></span> 登录中...';try{const t=await api.login(em,pw);auth.login(t,t.user);toast("登录成功","success");navigate("/panel");}catch(err){$("#login-error").innerHTML=`<div class="auth-error">${err.message||"登录失败"}</div>`;}finally{b.disabled=false;b.textContent="登录 TokenMP";}};
}

function renderRegister(){
  $("#app").innerHTML=authShell({mode:"register",title:"注册",desc:"创建你的 TokenMP 账号",footer:`已有账号？<a class="auth-link" href="#/login">立即登录</a>`,children:`
    <form class="auth-form" id="reg-form">
      <div class="auth-field"><label class="label" for="email">邮箱</label><input class="input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required /></div>
      <div class="auth-field"><label class="label" for="password">密码</label><div class="auth-pw-wrap"><input class="input" id="password" type="password" placeholder="至少 12 个字符" autocomplete="new-password" required style="padding-right:2.5rem" /><button type="button" class="auth-pw-toggle" id="pw-toggle">${I.eye}</button></div><div class="auth-strength" id="strength"><div class="auth-strength-bar"></div><div class="auth-strength-bar"></div><div class="auth-strength-bar"></div><div class="auth-strength-bar"></div></div></div>
      <div class="auth-field"><label class="label" for="confirm">确认密码</label><input class="input" id="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password" required /></div>
      <div id="reg-error"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-btn">创建账号</button>
    </form>`});
  $("#pw-toggle").onclick=()=>{const i=$("#password");const p=i.type==="password";i.type=p?"text":"password";$("#pw-toggle").innerHTML=p?I.eyeOff:I.eye;};
  $("#password").oninput=()=>{const v=$("#password").value;let s=0;if(v.length>=12)s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;const cols=["var(--tmp-color-action-destructive)","var(--tmp-color-status-warning-text)","var(--tmp-color-status-info-text)","var(--tmp-color-status-success-text)"];$$(".auth-strength-bar").forEach((b,i)=>{b.style.background=i<s?cols[s-1]:"var(--tmp-color-border-default)";});};
  $("#reg-form").onsubmit=async(e)=>{e.preventDefault();const em=$("#email").value.trim();const pw=$("#password").value;const cf=$("#confirm").value;if(pw!==cf){$("#reg-error").innerHTML=`<div class="auth-error">两次输入的密码不一致</div>`;return;}const b=$("#reg-btn");b.disabled=true;b.innerHTML='<span class="spinner"></span> 创建中...';try{await api.register(em,pw);toast("注册成功，请登录","success");navigate("/login");}catch(err){$("#reg-error").innerHTML=`<div class="auth-error">${err.message||"注册失败"}</div>`;}finally{b.disabled=false;b.textContent="创建账号";}};
}

/* ===== Panel Layout =====
   nav 结构：分组数组 {label?, items[]}，参考 july PANEL_NAV。
   主导航（业务）+ 横切组（用 label 分隔）。
   移动端底部导航：前 3 个常用 tab 直接显示 + “更多”按钮弹 bottom sheet。 */
const navGroups=[
  {items:[
    {label:"概览",path:"/panel",icon:"dashboard"},
    {label:"API 密钥",path:"/panel/keys",icon:"key"},
    {label:"请求",path:"/panel/requests",icon:"fileText"},
    {label:"设置",path:"/panel/settings",icon:"settings"},
  ]},
  {label:"横切",items:[
    {label:"公告",path:"/panel/announcements",icon:"megaphone"},
    {label:"通知",path:"/panel/notifications",icon:"bell"},
  ]},
];
// 扁平化供查找
const allNav=navGroups.flatMap(g=>g.items);
// 移动端底部直接显示的 tab（前 3 个）
const mobileTabs=allNav.slice(0,3);
// 其余进入“更多”
const mobileMore=allNav.slice(3);
function isActive(p,h){return h==="/panel"?p==="/panel":p===h||p.startsWith(h+"/");}
function renderPanel(){panelLayout(renderOverview);}
function renderKeys(){panelLayout(renderKeysPage);}
function renderReqs(){panelLayout(renderReqsPage);}
function renderSet(){panelLayout(renderSetPage);}

function panelLayout(contentFn){
  const p=window.location.hash.slice(1)||"/panel";
  const u=auth.state.user||{};
  const ini=(u.email||"U").charAt(0).toUpperCase();
  const sidebarGroupsHtml=navGroups.map(g=>`<div class="sidebar-group">${g.label?`<p class="sidebar-group-label">${g.label}</p>`:""}<div class="sidebar-group-items">${g.items.map(i=>`<a href="#${i.path}" class="sidebar-link ${isActive(p,i.path)?"active":""}">${I[i.icon]} ${i.label}</a>`).join("")}</div></div>`).join("");
  const moreActive=mobileMore.some(i=>isActive(p,i.path));
  const mobileTabsHtml=mobileTabs.map(i=>`<button class="bottom-nav-item ${isActive(p,i.path)?"active":""}" data-path="${i.path}">${I[i.icon]}<span>${i.label}</span></button>`).join("");
  const moreItemsHtml=mobileMore.map(i=>`<button class="sheet-item ${isActive(p,i.path)?"active":""}" data-path="${i.path}">${I[i.icon]} ${i.label}</button>`).join("");
  $("#app").innerHTML=`<div class="panel-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="panel-logo-mark">${LOGO}</span>TokenMP</div>
      <nav class="sidebar-nav">${sidebarGroupsHtml}</nav>
      <div class="sidebar-footer"><button class="btn btn-ghost sidebar-logout" id="sb-logout">${I.logout} 退出登录</button></div>
    </aside>
    <div class="panel-content">
      <header class="panel-header">
        <div class="panel-header-left"><span class="panel-logo" style="display:none" id="m-logo">${LOGO}</span></div>
        <div class="panel-header-right">
          <button class="header-search" id="header-search" aria-label="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="hs-label">搜索</span><kbd class="hs-kbd">⌘K</kbd></button>
          <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="切换主题"><span class="moon">${I.moon}</span><span class="sun">${I.sun}</span></button>
          <div class="user-menu-wrap"><button class="user-menu-btn" id="user-btn"><div class="user-avatar">${ini}</div><span class="user-menu-name" id="user-name">${u.email||"用户"}</span><svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
            <div class="user-dropdown" id="user-dropdown" style="display:none">
              <div class="ud-header"><div class="user-avatar">${ini}</div><div class="ud-email">${u.email||"用户"}</div></div>
              <button class="ud-item" id="ud-settings">${I.settings} 设置</button>
              <button class="ud-item ud-danger" id="ud-logout">${I.logout} 退出登录</button>
            </div></div>
        </div>
      </header>
      <main class="panel-main" id="panel-main"></main>
    </div>
    <nav class="bottom-nav">
      ${mobileTabsHtml}
      <button class="bottom-nav-item bottom-nav-more ${moreActive?"active":""}" id="more-btn" aria-label="更多功能">${I.more}<span>更多</span></button>
    </nav>
  </div>`;
  // mobile: show logo; desktop: hide (sidebar has it)
  const mq=window.matchMedia("(max-width: 47.99rem)");
  const syncLogo=()=>{$("#m-logo").style.display=mq.matches?"flex":"none";$("#user-name").style.display=mq.matches?"none":"inline";};
  syncLogo();mq.addEventListener("change",syncLogo);
  $("#theme-toggle").onclick=toggleTheme;
  $("#sb-logout").onclick=async()=>{await api.logout().catch(()=>{});auth.logout();navigate("/login");};
  $$(".bottom-nav-item[data-path]").forEach(b=>b.onclick=()=>navigate(b.dataset.path));
  $("#more-btn").onclick=()=>openMoreSheet(moreItemsHtml);
  // header 搜索（占位）
  $("#header-search").onclick=()=>toast("搜索功能开发中","info");
  // 用户下拉菜单
  const dd=$("#user-dropdown");
  $("#user-btn").onclick=(e)=>{e.stopPropagation();dd.style.display=dd.style.display==="none"?"block":"none";};
  document.addEventListener("click",()=>{dd.style.display="none";});
  $("#ud-settings").onclick=()=>{dd.style.display="none";navigate("/panel/settings");};
  $("#ud-logout").onclick=async()=>{dd.style.display="none";await api.logout().catch(()=>{});auth.logout();navigate("/login");};
  contentFn();
}

function openMoreSheet(itemsHtml){
  const root=$("#modal-root");
  root.innerHTML=`<div class="sheet-overlay" id="more-overlay"><div class="sheet-panel"><div class="sheet-handle"></div><div class="sheet-title">更多功能</div>${itemsHtml}</div></div>`;
  requestAnimationFrame(()=>$("#more-overlay").classList.add("open"));
  $("#more-overlay").addEventListener("click",e=>{if(e.target.id==="more-overlay")closeMoreSheet();});
  $$("#more-overlay .sheet-item").forEach(b=>b.onclick=()=>{closeMoreSheet();navigate(b.dataset.path);});
}
function closeMoreSheet(){const o=$("#more-overlay");if(o){o.classList.remove("open");setTimeout(()=>{$("#modal-root").innerHTML="";},200);}}

/* ===== Overview Page ===== */
async function renderOverview(){
  const main=$("#panel-main");
  main.innerHTML=`<div class="page-header"><div><h1 class="page-title">概览</h1><p class="page-desc">账户、配额和最近请求</p></div><button class="btn btn-secondary btn-sm" id="refresh-ov">${I.refresh} 刷新</button></div>
    <div class="overview-grid" id="stat-grid"><div class="card stat-card skeleton" style="height:96px"></div><div class="card stat-card skeleton" style="height:96px"></div><div class="card stat-card skeleton" style="height:96px"></div></div>
    <div class="mt-6"><h2 class="section-title">最近请求</h2><div class="card" id="recent-list"><div class="skeleton" style="height:48px"></div></div></div>`;
  $("#refresh-ov").onclick=()=>renderOverview();
  try{
    const[user,quota,recent]=await Promise.all([api.getMe(),api.getQuota(),api.getRecentRequests(5)]);
    const pct=Math.round((quota.balance_tokens/quota.total_tokens)*100);
    $("#stat-grid").innerHTML=`
      <div class="card stat-card"><p class="stat-label">账户</p><p class="stat-value" style="font-size:var(--tmp-ref-font-size-md)">${user.email}</p><p class="stat-sub">${user.role==="admin"?"管理员":"普通用户"} · 注册于 ${fmtDate(user.created_at)}</p></div>
      <div class="card stat-card"><p class="stat-label">配额余额</p><p class="stat-value">${fmtTokens(quota.balance_tokens)}</p><p class="stat-sub">共 ${fmtTokens(quota.total_tokens)} · 今日已用 ${fmtTokens(quota.used_today)}</p><div class="progress mt-4"><div class="progress-bar" style="width:${pct}%"></div></div></div>
      <div class="card stat-card"><p class="stat-label">套餐</p><p class="stat-value" style="font-size:var(--tmp-ref-font-size-lg)">${quota.plan}</p><p class="stat-sub">预留 ${fmtNum(quota.reserved)} tokens</p></div>`;
    $("#recent-list").innerHTML=recent.length?`<div class="data-list">${recent.map(r=>`<div class="data-row" style="grid-template-columns:2fr 2fr 1fr 1fr 1fr;gap:var(--tmp-ref-space-3)"><span class="mono text-sm">${r.id}</span><span class="text-sm">${r.model}</span>${protocolBadge(r.protocol)}${statusBadge(r.status)}<span class="text-sm text-muted">${fmtTokens(r.tokens)}</span></div>`).join("")}</div>`:`<div class="empty">${I.inbox}<p>暂无请求记录</p></div>`;
  }catch(err){toast("加载失败: "+(err.message||err),"error");}
}

/* ===== API Keys Page ===== */
async function renderKeysPage(){
  const main=$("#panel-main");
  main.innerHTML=`<div class="page-header"><div><h1 class="page-title">API 密钥</h1><p class="page-desc">管理你的 API 密钥</p></div><button class="btn btn-primary btn-sm" id="create-key">${I.plus} 创建密钥</button></div><div id="keys-list"></div>`;
  $("#create-key").onclick=openCreateKey;
  await loadKeys();
}
async function loadKeys(){
  const list=$("#keys-list");
  list.innerHTML=`<div class="skeleton" style="height:80px"></div>`;
  try{
    const keys=await api.getKeys();
    if(!keys.length){list.innerHTML=`<div class="empty">${I.key}<p>还没有 API 密钥</p></div>`;return;}
    list.innerHTML=`<div class="data-list">${keys.map(k=>`
      <div class="key-card" style="margin-bottom:var(--tmp-ref-space-3)">
        <div class="key-card-head"><div><span class="text-sm" style="font-weight:var(--tmp-ref-font-weight-semibold)">${k.name}</span> ${k.status==="active"?'<span class="badge badge-success">活跃</span>':'<span class="badge badge-muted">已撤销</span>'}</div><div class="flex gap-2">${k.status==="active"?`<button class="btn btn-ghost btn-sm" data-copy="${k.masked}">${I.copy}</button><button class="btn btn-ghost btn-sm" data-revoke="${k.id}" style="color:var(--tmp-color-status-danger-text)">${I.trash}</button>`:""}</div></div>
        <div class="flex items-center gap-3"><span class="mono text-sm">${k.masked}</span></div>
        <div class="flex gap-3 mt-4 text-xs text-muted"><span>创建于 ${fmtDate(k.created_at)}</span><span>·</span><span>最近使用 ${fmtDate(k.last_used)}</span></div>
      </div>`).join("")}</div>
      <div class="data-list" style="display:none"></div>`;
    // desktop table view
    const dt=window.matchMedia("(min-width:48rem)");
    if(dt.matches){
      list.innerHTML=`<div class="card"><div class="table-head" style="grid-template-columns:2fr 2fr 1fr 1fr 2fr 1fr"><span>名称</span><span>密钥</span><span>状态</span><span>创建于</span><span>最近使用</span><span>操作</span></div><div class="data-list" style="gap:0">${keys.map(k=>`<div class="data-row" style="grid-template-columns:2fr 2fr 1fr 1fr 2fr 1fr;align-items:center"><span class="text-sm" style="font-weight:var(--tmp-ref-font-weight-semibold)">${k.name}</span><span class="mono text-sm">${k.masked}</span>${k.status==="active"?'<span class="badge badge-success">活跃</span>':'<span class="badge badge-muted">已撤销</span>'}<span class="text-sm text-muted">${fmtDate(k.created_at)}</span><span class="text-sm text-muted">${fmtDate(k.last_used)}</span><div class="flex gap-2">${k.status==="active"?`<button class="btn btn-ghost btn-sm" data-copy="${k.masked}">${I.copy}</button><button class="btn btn-ghost btn-sm" data-revoke="${k.id}" style="color:var(--tmp-color-status-danger-text)">${I.trash}</button>`:""}</div></div>`).join("")}</div></div>`;
    }
    $$("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy);toast("已复制到剪贴板","success");});
    $$("[data-revoke]").forEach(b=>b.onclick=()=>openRevoke(b.dataset.revoke));
  }catch(err){toast("加载失败: "+(err.message||err),"error");}
}
function openCreateKey(){
  showModal({title:"创建 API 密钥",body:`<div class="auth-field"><label class="label" for="key-name">名称</label><input class="input" id="key-name" placeholder="例如：生产环境" /></div>`,footer:`<button class="btn btn-secondary" id="modal-cancel">取消</button><button class="btn btn-primary" id="modal-confirm">创建</button>`});
  $("#modal-cancel").onclick=closeModal;
  $("#modal-confirm").onclick=async()=>{const name=$("#key-name").value.trim();const b=$("#modal-confirm");b.disabled=true;b.innerHTML='<span class="spinner"></span>';try{const k=await api.createKey(name);closeModal();showModal({title:"密钥已创建",body:`<p class="text-sm text-muted">请立即复制保存，关闭后将无法再次查看完整密钥：</p><div class="card card-pad mt-4"><div class="flex items-center gap-2"><span class="mono text-sm" style="word-break:break-all">${k.full_key}</span></div></div>`,footer:`<button class="btn btn-secondary" id="copy-new">${I.copy} 复制</button><button class="btn btn-primary" id="done">完成</button>`});$("#copy-new").onclick=()=>{navigator.clipboard?.writeText(k.full_key);toast("已复制","success");};$("#done").onclick=()=>{closeModal();loadKeys();};}catch(err){toast("创建失败: "+(err.message||err),"error");b.disabled=false;b.textContent="创建";}};
}
function openRevoke(id){
  showModal({title:"撤销密钥",body:`<p class="text-sm">确定要撤销这个 API 密钥吗？此操作不可撤销，使用该密钥的请求将立即失败。</p>`,footer:`<button class="btn btn-secondary" id="modal-cancel">取消</button><button class="btn btn-destructive" id="modal-confirm">撤销</button>`});
  $("#modal-cancel").onclick=closeModal;
  $("#modal-confirm").onclick=async()=>{const b=$("#modal-confirm");b.disabled=true;b.innerHTML='<span class="spinner"></span>';try{await api.revokeKey(id);closeModal();toast("密钥已撤销","success");loadKeys();}catch(err){toast("撤销失败","error");b.disabled=false;b.textContent="撤销";}};
}

/* ===== Requests Page ===== */
let reqPage=1;
async function renderReqsPage(){
  const main=$("#panel-main");
  main.innerHTML=`<div class="page-header"><div><h1 class="page-title">请求日志</h1><p class="page-desc">查看最近的 API 请求</p></div><button class="btn btn-secondary btn-sm" id="refresh-req">${I.refresh} 刷新</button></div><div id="req-list"></div><div class="pagination" id="pagination"></div>`;
  $("#refresh-req").onclick=()=>{reqPage=1;renderReqsPage();};
  await loadRequests();
}
async function loadRequests(){
  const list=$("#req-list");
  list.innerHTML=`<div class="skeleton" style="height:48px"></div>`;
  try{
    const{items,total,page,pageSize}=await api.getRequests(reqPage);
    const totalPages=Math.ceil(total/pageSize);
    if(!items.length){list.innerHTML=`<div class="empty">${I.inbox}<p>暂无请求记录</p></div>`;return;}
    const dt=window.matchMedia("(min-width:48rem)");
    if(dt.matches){
      list.innerHTML=`<div class="card"><div class="table-head" style="grid-template-columns:1.5fr 2fr 1.5fr 1fr 1fr 1fr"><span>时间</span><span>模型</span><span>协议</span><span>状态</span><span>Tokens</span><span>耗时</span></div><div class="data-list" style="gap:0">${items.map(r=>`<div class="data-row" style="grid-template-columns:1.5fr 2fr 1.5fr 1fr 1fr 1fr;align-items:center"><span class="text-sm text-muted">${fmtDate(r.time)}</span><span class="text-sm">${r.model}</span>${protocolBadge(r.protocol)}${statusBadge(r.status)}<span class="text-sm">${fmtTokens(r.tokens)}</span><span class="text-sm text-muted">${r.latency}ms</span></div>`).join("")}</div></div>`;
    }else{
      list.innerHTML=`<div class="data-list">${items.map(r=>`<div class="data-row"><div class="flex items-center" style="justify-content:space-between"><span class="text-sm" style="font-weight:var(--tmp-ref-font-weight-semibold)">${r.model}</span>${statusBadge(r.status)}</div><div class="flex gap-3 mt-4 text-xs text-muted"><span>${fmtDate(r.time)}</span><span>·</span>${protocolBadge(r.protocol)}<span>·</span><span>${fmtTokens(r.tokens)} tokens</span><span>·</span><span>${r.latency}ms</span></div></div>`).join("")}</div>`;
    }
    // pagination
    const pg=$("#pagination");
    if(totalPages<=1){pg.innerHTML="";return;}
    let html="";
    html+=`<button class="page-btn" ${page<=1?"disabled":""} data-p="${page-1}">上一页</button>`;
    for(let i=1;i<=totalPages;i++){html+=`<button class="page-btn ${i===page?"active":""}" data-p="${i}">${i}</button>`;}
    html+=`<button class="page-btn" ${page>=totalPages?"disabled":""} data-p="${page+1}">下一页</button>`;
    pg.innerHTML=html;
    $$(".page-btn").forEach(b=>b.onclick=()=>{if(!b.disabled){reqPage=parseInt(b.dataset.p);loadRequests();}});
  }catch(err){toast("加载失败: "+(err.message||err),"error");}
}

/* ===== Settings Page ===== */
function renderSetPage(){
  const u=auth.state.user||{};
  const ini=(u.email||"U").charAt(0).toUpperCase();
  $("#panel-main").innerHTML=`<div class="page-header"><div><h1 class="page-title">设置</h1><p class="page-desc">管理账户和密码</p></div></div>
    <div class="overview-grid" style="grid-template-columns:1fr">
      <div class="card card-pad">
        <h2 class="section-title">账户信息</h2>
        <div class="account-info">
          <div class="account-row"><span class="account-key">用户 ID</span><span class="account-val mono">${u.id||"—"}</span></div>
          <div class="account-row"><span class="account-key">邮箱</span><span class="account-val">${u.email||"—"}</span></div>
          <div class="account-row"><span class="account-key">角色</span><span class="account-val">${u.role==="admin"?"管理员":"普通用户"}</span></div>
          <div class="account-row"><span class="account-key">状态</span>${u.status==="active"?'<span class="badge badge-success">活跃</span>':'<span class="badge badge-danger">禁用</span>'}</div>
          <div class="account-row"><span class="account-key">注册时间</span><span class="account-val">${fmtDate(u.created_at)}</span></div>
        </div>
      </div>
      <div class="card card-pad mt-6">
        <h2 class="section-title">修改密码</h2>
        <form class="auth-form" id="pw-form">
          <div class="auth-field"><label class="label" for="cur-pw">当前密码</label><input class="input" id="cur-pw" type="password" placeholder="输入当前密码" required /></div>
          <div class="auth-field"><label class="label" for="new-pw">新密码</label><input class="input" id="new-pw" type="password" placeholder="至少 12 个字符" required /></div>
          <div class="auth-field"><label class="label" for="conf-pw">确认新密码</label><input class="input" id="conf-pw" type="password" placeholder="再次输入新密码" required /></div>
          <div id="pw-error"></div>
          <button type="submit" class="btn btn-primary" id="pw-btn">保存修改</button>
        </form>
      </div>
      <div class="card card-pad mt-6">
        <h2 class="section-title">登出所有设备</h2>
        <p class="text-sm text-muted">撤销所有登录会话，包括当前设备。操作后需要重新登录。</p>
        <button class="btn btn-destructive mt-4" id="logout-all">登出全部会话</button>
      </div>
    </div>`;
  $("#pw-form").onsubmit=async(e)=>{e.preventDefault();const cur=$("#cur-pw").value;const nw=$("#new-pw").value;const cf=$("#conf-pw").value;if(nw!==cf){$("#pw-error").innerHTML=`<div class="auth-error">两次输入的新密码不一致</div>`;return;}const b=$("#pw-btn");b.disabled=true;b.innerHTML='<span class="spinner"></span> 保存中...';try{await api.changePassword(cur,nw);toast("密码已修改，请重新登录","success");closeModal();await api.logout().catch(()=>{});auth.logout();navigate("/login");}catch(err){$("#pw-error").innerHTML=`<div class="auth-error">${err.message||"修改失败"}</div>`;}finally{b.disabled=false;b.textContent="保存修改";}};
  $("#logout-all").onclick=()=>{showModal({title:"登出全部会话",body:`<p class="text-sm">确定要登出所有设备吗？当前会话也会被注销。</p>`,footer:`<button class="btn btn-secondary" id="modal-cancel">取消</button><button class="btn btn-destructive" id="modal-confirm">确认登出</button>`});$("#modal-cancel").onclick=closeModal;$("#modal-confirm").onclick=async()=>{await api.logout().catch(()=>{});auth.logout();closeModal();navigate("/login");};};
}

/* ===== Init ===== */
initTheme();
router();
</script>
